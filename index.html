<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Premios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <style>
:root{
  --bg1:#1a0f33; --bg2:#341b61; --gold:#f5c451; --gold2:#ffe39a; --ink:#f7f2ff; --mut:#b9aedc;
  --card:rgba(255,255,255,.08); --line:rgba(255,255,255,.16); --ok:#58d68d; --bad:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;min-height:100vh;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding:16px 16px 90px}
.wrap.wide{max-width:1000px}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:.2em 0 .4em}
h1{font-size:1.5rem;color:var(--gold)}
h2{font-size:1.5rem}
h3{font-size:1.1rem;color:var(--gold2)}
p{line-height:1.45}
.mut{color:var(--mut)} .sm{font-size:.85rem} .grow{flex:1;min-width:0}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.who{display:flex;align-items:center;gap:8px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.lead{font-size:1.05rem}
.pill{display:inline-block;background:rgba(245,196,81,.16);border:1px solid rgba(245,196,81,.5);color:var(--gold2);
  border-radius:999px;padding:4px 12px;font-weight:600;font-size:.9rem;margin:6px 0}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.28);color:var(--ink);font:inherit;font-size:1rem}
textarea{min-height:140px;resize:vertical}
input::placeholder,textarea::placeholder{color:#8b80b3}
select option{color:#111}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1a00;border:0;border-radius:12px;
  padding:12px 18px;font-weight:700;margin:6px 6px 6px 0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 6px 6px 0}
.ghost.sm,.btn.sm{padding:6px 10px;font-size:.85rem;margin:0}
.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.av{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;
  font-weight:700;font-size:.8rem;color:#fff;flex:none}
.chips{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.chip{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:1rem}
.chip:active{background:rgba(245,196,81,.2)}
.vrow,.rrow,.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.vrow:first-of-type,.rrow:first-of-type,.prow:first-of-type{border-top:0}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.stage{text-align:center;background:radial-gradient(circle at 50% 0,rgba(245,196,81,.2),transparent 70%),var(--card);
  border:1px solid var(--line);border-radius:20px;padding:28px 16px;margin:12px 0}
.stage .big{font-size:4rem;line-height:1}
.stage .cat{color:var(--gold2);font-size:1.7rem}
.stage .winner{font-size:2.4rem;color:var(--gold);animation:pop .6s ease}
.drum{animation:shake .5s infinite}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
dialog{border:0;border-radius:18px;background:#241547;color:var(--ink);padding:18px;max-width:94vw}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog.sheet{width:min(420px,94vw)}
dialog.dip{width:min(900px,96vw);padding:12px}
.dipcv{width:100%;height:auto;border-radius:10px;display:block;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0d0a1a;border:1px solid var(--line);
  padding:12px 18px;border-radius:12px;z-index:99;max-width:92vw;transition:opacity .4s}
.toast.bad{border-color:var(--bad)} .toast.out{opacity:0}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:98}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tabs button{white-space:nowrap;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.tabs button.on{background:var(--gold);color:#2a1a00;font-weight:700;border-color:var(--gold)}
.steps{padding-left:20px;margin:6px 0}
.steps li{padding:3px 0;color:var(--mut)} .steps li.on{color:var(--gold);font-weight:700}
.badge{display:inline-block;font-size:.72rem;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--mut)}
.badge.g{border-color:var(--ok);color:var(--ok)} .badge.y{border-color:var(--gold);color:var(--gold)}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:middle;font-size:.95rem}
th{color:var(--gold2);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* Modo presentación (solo admin) */
.present{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;
  background:radial-gradient(circle at 50% 0,#4b2a8a,#150c2b 70%);overflow:auto}
.pstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:24px 20px 8px;gap:6px}
.pstage .big{font-size:clamp(3.5rem,10vw,7rem);line-height:1}
.ptitle{font-size:clamp(2rem,6vw,4.5rem);color:var(--gold)}
.pcat{font-size:clamp(1.8rem,5vw,3.8rem);color:var(--gold2);max-width:1000px}
.pwin{font-size:clamp(2.6rem,8vw,6rem);color:var(--gold);animation:pop .6s ease;margin:.1em 0}
.pdip{width:min(560px,86vw);margin-top:10px}
.pbar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;background:rgba(0,0,0,.35)}
.pbar .btn,.pbar .ghost{margin:0}
.phint{color:var(--mut);min-width:70px;text-align:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;width:min(1000px,94vw);margin-top:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left}

/* Lista larga de categorías dentro del selector */
.chips.scroll{max-height:55vh;overflow-y:auto;padding-right:2px}

</style>
</head>
